name: cicloradar
description: "CicloRadar - Sistema de seguridad comunitaria, radar y alertas SOS para ciclistas en Flutter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  # Cartografía interactiva y coordenadas
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Geolocalización en tiempo real
  geolocator: ^13.0.2

  # Alerta sonora y reproducción de tonos
  audioplayers: ^6.1.1

  # Vibración háptica en emergencias
  vibration: 3.2.1

  # Mantener pantalla encendida en soporte de manillar
  wakelock_plus: ^1.2.8

  # Manejo de estado reactivo
  provider: ^6.1.2

  # Persistencia de preferencias
  shared_preferences: ^2.3.5
  http: ^1.6.0

  # Iconografía y diseño
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_messaging: ^17.0.1
  cloud_functions: ^7.0.1
  firebase_app_check: ^0.5.1
  cloud_firestore: ^7.1.0
  health: 13.3.2
  path_provider: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
